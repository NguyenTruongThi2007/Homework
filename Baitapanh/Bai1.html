<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .gallery {
            width: 550px;
            margin: 50px auto;
            padding: 5px;
            background-color: white;
            border: 1px solid #ddd;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.15);

            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 180px 55px 180px;
            gap: 5px;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Ảnh 1 - góc trên bên trái */
        .image1 {
            grid-column: 1;
            grid-row: 1;
        }

        /* Ảnh 2 - góc trên bên phải */
        .image2 {
            grid-column: 2;
            grid-row: 1 / 3;
        }

        /* Ảnh 3 - giữa bên trái */
        .image3 {
            grid-column: 1;
            grid-row: 2;
        }

        /* Ảnh 4 - dưới bên trái */
        .image4 {
            grid-column: 1;
            grid-row: 3;
        }

        /* Ảnh 5 - dưới bên phải */
        .image5 {
            grid-column: 2;
            grid-row: 3;
        }
    </style>
</head>

<body>

    <div class="gallery">

        <div class="image1">
            <img src="picture/lampard1.jpg" alt="Phong cảnh 1">
        </div>

        <div class="image2">
            <img src="picture/lampard2.webp" alt="Phong cảnh 2">
        </div>

        <div class="image3">
            <img src="picture/lampard5.jpg" alt="Phong cảnh 3">
        </div>

        <div class="image4">
            <img src="picture/lampard4.jpeg" alt="Phong cảnh 4">
        </div>

        <div class="image5">
            <img src="picture/chelsea.png" alt="Phong cảnh 5">
        </div>

    </div>

</body>
</html>
